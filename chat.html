<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Mageri Uchumi</title>
  <style>
    body { font-family: Arial; padding: 15px; background: #f5f5f5; margin: 0; }
    #chatBox { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 5px; }
    #msgInput { width: 65%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px 2px; }
    button:hover { background: #45a049; }
    .me { text-align: right; color: blue; margin: 5px 0; padding: 5px; background: #e3f2fd; border-radius: 5px; }
    .other { text-align: left; color: black; margin: 5px 0; padding: 5px; background: #fff; border-radius: 5px; }
    input { padding: 10px; margin: 5px 0; width: 95%; border: 1px solid #ccc; border-radius: 5px; }
  </style>
</head>
<body>
  <h3>Chat - Mageri Uchumi Daima</h3>
  
  <div id="loginDiv">
    <h4>Ingia au Tengeneza Account</h4>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <br>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>

  <div id="chatDiv" style="display:none;">
    <p><strong>Umeingia kama:</strong> <span id="userEmail"></span></p>
    <input id="friendId" placeholder="Weka User ID ya rafiki">
    <button id="startChatBtn">Anza Chat</button>
    
    <div id="chatBox"></div>
    <input id="msgInput" placeholder="Andika message...">
    <button id="sendBtn">Tuma</button>
    <button id="logoutBtn" style="background: red;">Toka</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, addDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // BADILISHA HII NA CONFIG YAKO
 const firebaseConfig = {
  apiKey: "AIzaSyAx1Tg2V-OSBfUAvw5-LxL-iyyWb5pbcRQ",
  authDomain: "mageri-uchumi-daima.firebaseapp.com",
  projectId: "mageri-uchumi-daima",
  storageBucket: "mageri-uchumi-daima.firebasestorage.app",
  messagingSenderId: "670762770974",
  appId: "1:670762770974:web:32b326c8c6ef0a273f040f"
}; 
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentChatId = null;
    let currentUserId = null;

    document.getElementById('signupBtn').onclick = async () => {
      try {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", userCred.user.uid), { uid: userCred.user.uid, email: email });
        alert("Account imetengenezwa! Sasa login.");
      } catch(e) { alert("Error: " + e.message); }
    };

    document.getElementById('loginBtn').onclick = async () => {
      try {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) { alert("Error: " + e.message); }
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        document.getElementById('loginDiv').style.display = 'none';
        document.getElementById('chatDiv').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email + " | ID: " + user.uid;
      }
    });

    document.getElementById('startChatBtn').onclick = async () => {
      const friendId = document.getElementById('friendId').value;
      if (!friendId) { alert("Weka User ID ya rafiki"); return; }
      currentChatId = currentUserId > friendId ? currentUserId + "_" + friendId : friendId + "_" + currentUserId;
      
      await setDoc(doc(db, "chats", currentChatId), { participants: [currentUserId, friendId] });

      const q = query(collection(db, "chats", currentChatId, "messages"), orderBy("timestamp"));
      onSnapshot(q, (snapshot) => {
        document.getElementById('chatBox').innerHTML = snapshot.docs.map(doc => {
          const data = doc.data();
          const cls = data.senderId === currentUserId ? 'me' : 'other';
          return `<div class="${cls}">${data.text}</div>`;
        }).join('');
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
      });
    };

    document.getElementById('sendBtn').onclick = async () => {
      const text = document.getElementById('msgInput').value;
      if (!text || !currentChatId) return;
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        text: text, senderId: currentUserId, timestamp: Date.now()
      });
      document.getElementById('msgInput').value = '';
    };
  </script>
</body>
</html>
