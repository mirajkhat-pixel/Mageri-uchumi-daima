<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViBTalk</title>
<style>
:root {
  --bg: #0f172a; --bg2: #1e293b; --text: #f8fafc; --muted: #94a3b8;
  --accent: #6366f1; --accent2: #22d3ee; --border: #334155;
  --msg-me: #6366f1; --msg-other: #334155; --danger: #ef4444; --success: #10b981;
}

[data-theme="light"] {
  --bg: #f8fafc; --bg2: #ffffff; --text: #0f172a; --muted: #64748b;
  --accent: #4f46e5; --accent2: #0891b2; --border: #e2e8f0;
  --msg-me: #4f46e5; --msg-other: #e2e8f0;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }

header { padding: 14px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.btn { padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-icon { padding: 8px; border-radius: 50%; background: transparent; border: 1px solid var(--border); cursor: pointer; }

.container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: var(--bg2); padding: 32px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

input, textarea { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }

.chat-container { display: none; flex: 1; overflow: hidden; }
.sidebar { width: 280px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; }
.chat-main { flex: 1; display: flex; flex-direction: column; }

.chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.message-wrap { display: flex; flex-direction: column; }
.message-wrap.me { align-items: flex-end; }
.message { padding: 10px 14px; border-radius: 18px; max-width: 70%; word-wrap: break-word; line-height: 1.4; }
.message.me { background: var(--msg-me); color: white; border-bottom-right-radius: 4px; }
.message.other { background: var(--msg-other); color: var(--text); border-bottom-left-radius: 4px; }
.message img { max-width: 100%; border-radius: 12px; margin-top: 8px; }
.msg-meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 8px; }

.chat-input { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--border); background: var(--bg2); align-items: flex-end; }
.chat-input textarea { margin: 0; flex: 1; resize: none; max-height: 120px; min-height: 44px; }

.toolbar { display: flex; gap: 8px; padding: 0 16px 12px; }
.emoji-picker { position: absolute; bottom: 70px; right: 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: none; grid-template-columns: repeat(8, 1fr); gap: 8px; max-height: 200px; overflow-y: auto; z-index: 20; }
.emoji-picker.show { display: grid; }
.emoji { cursor: pointer; font-size: 24px; text-align: center; padding: 4px; border-radius: 6px; }
.emoji:hover { background: var(--border); }

.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; cursor: pointer; }
.avatar-big { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }

.profile-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
.profile-modal.show { display: flex; }
.profile-content { background: var(--bg2); padding: 32px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }

.tab-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-btn { padding: 10px 16px; background: transparent; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.user-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
.user-item:hover { background: var(--bg); }
.user-info { flex: 1; }
.user-name { font-weight: 600; }
.user-status { font-size: 12px; color: var(--muted); }

.info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.info-label { color: var(--muted); }
.info-value { font-weight: 500; }

.typing { font-size: 13px; color: var(--muted); font-style: italic; padding: 0 20px 10px; display: none; }

@media (max-width: 768px) {.sidebar { display: none; }.message { max-width: 85%; } }
</style>
</head>
<body>

<header>
  <div class="logo">ViBTalk</div>
  <div style="display:flex; gap:10px; align-items:center;">
    <img id="headerAvatar" class="avatar" style="display:none;" onclick="openProfile()">
    <span class="user-info" id="userInfo"></span>
    <button class="btn-icon" id="themeBtn">🌙</button>
    <button class="btn btn-ghost" id="logoutBtn" style="display:none">Toka</button>
  </div>
</header>

<div class="container" id="authSection">
  <div class="card">
    <h2>Karibu ViBTalk</h2>
    <div style="text-align:center; margin-bottom:16px;">
      <img id="previewAvatar" class="avatar-big" src="https://i.pravatar.cc/150?u=default">
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <button class="btn btn-ghost" onclick="document.getElementById('avatarInput').click()" style="margin-top:10px;">Chagua Picha</button>
    </div>
    <input type="email" id="email" placeholder="Email yako">
    <input type="password" id="password" placeholder="Nywila">
    <input type="text" id="username" placeholder="Jina lako" maxlength="20">
    <input type="tel" id="phone" placeholder="Namba ya simu" maxlength="15">
    <button class="btn" id="loginBtn" style="width:100%; margin-bottom:10px">Ingia</button>
    <button class="btn btn-ghost" id="signupBtn" style="width:100%">Jisajili</button>
    <p id="authMsg" style="margin-top:12px; text-align:center; color:var(--danger)"></p>
  </div>
</div>

<div class="chat-container" id="chatSection">
  <div class="sidebar">
    <div style="padding:16px; border-bottom:1px solid var(--border);">
      <strong>Marafiki</strong>
    </div>
    <div id="friendsList" style="padding:12px;">
      <div style="color:var(--muted); font-size:14px;">Hakuna marafiki bado</div>
    </div>
    <div style="padding:16px; border-top:1px solid var(--border);">
      <button class="btn btn-ghost" style="width:100%" onclick="openAddFriend()">➕ Ongeza Rafiki</button>
    </div>
  </div>

  <div class="chat-main">
    <div class="chat-box" id="chatBox">
      <div style="text-align:center; opacity:0.6; padding:40px;">Inapakia mazungumzo...</div>
    </div>
    <div class="typing" id="typing">Mtu anaandika...</div>

    <div class="toolbar">
      <button class="btn-icon" id="emojiBtn">😊</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <button class="btn-icon" onclick="document.getElementById('imageInput').click()">🖼️</button>
    </div>

    <div class="chat-input">
      <textarea id="msgInput" placeholder="Andika ujumbe..." rows="1" maxlength="1000"></textarea>
      <button class="btn" id="sendBtn">Tuma</button>
    </div>

    <div class="emoji-picker" id="emojiPicker"></div>
  </div>
</div>

<!-- Profile Modal -->
<div class="profile-modal" id="profileModal">
  <div class="profile-content">
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
      <button class="tab-btn" onclick="switchTab('edit')">Hariri</button>
      <button class="tab-btn" onclick="switchTab('friends')">Marafiki</button>
    </div>

    <div id="tab-profile" class="tab-content active">
      <div style="text-align:center; margin-bottom:20px;">
        <img id="modalAvatar" class="avatar-big">
        <h3 id="modalName" style="margin-top:12px;"></h3>
      </div>
      <div id="profileInfo"></div>
      <button class="btn btn-ghost" style="width:100%; margin-top:20px;" onclick="closeProfile()">Funga</button>
    </div>

    <div id="tab-edit" class="tab-content">
      <input type="text" id="editUsername" placeholder="Jina">
      <input type="tel" id="editPhone" placeholder="Namba ya simu">
      <input type="file" id="editAvatar" accept="image/*">
      <button class="btn" style="width:100%" onclick="saveProfile()">Hifadhi</button>
      <button class="btn btn-ghost" style="width:100%; margin-top:10px;" onclick="switchTab('profile')">Rudi</button>
    </div>

    <div id="tab-friends" class="tab-content">
      <h4>Ombi la Urafiki</h4>
      <div id="friendRequests" style="margin:12px 0;"></div>
      <h4>Watumiaji Wengine</h4>
      <div id="allUsers" style="margin:12px 0;"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, query, limitToLast, set, onValue, serverTimestamp, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAx1Tg2V-OSBfUAvw5-LxL-iyyWb5pbcRQ",
  authDomain: "mageri-uchumi-daima.firebaseapp.com",
  databaseURL: "https://mageri-uchumi-daima-default-rtdb.firebaseio.com",
  projectId: "mageri-uchumi-daima",
  storageBucket: "mageri-uchumi-daima.appspot.com",
  messagingSenderId: "670762770974",
  appId: "1:670762770974:web:32b326c8c6ef0a273f040f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

let currentUserData = {};
const emojis = ["😀","😂","😍","🥰","😎","🤔","😭","😡","👍","👎","❤️","🔥","💯","🎉","🙏","👌"];
const emojiPicker = document.getElementById('emojiPicker');

emojis.forEach(e => {
  const div = document.createElement('div');
  div.className = 'emoji';
  div.textContent = e;
  div.onclick = () => {
    document.getElementById('msgInput').value += e;
    emojiPicker.classList.remove('show');
  };
  emojiPicker.appendChild(div);
});

document.getElementById('emojiBtn').onclick = () => emojiPicker.classList.toggle('show');

// Theme
let dark = localStorage.getItem('theme')!== 'light';
setTheme();
document.getElementById('themeBtn').onclick = () => {
  dark =!dark;
  localStorage.setItem('theme', dark? 'dark' : 'light');
  setTheme();
};
function setTheme() {
  document.documentElement.setAttribute('data-theme', dark? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark? '🌙' : '☀️';
}

// Auth state
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('chatSection').style.display = 'flex';
    document.getElementById('logoutBtn').style.display = 'inline-block';

    await loadUserData(user);
    loadMessages();
    setupTyping();
    loadFriends();
    loadFriendRequests();
    loadAllUsers();
  } else {
    document.getElementById('authSection').style.display = 'flex';
    document.getElementById('chatSection').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
  }
});

// Load user data
async function loadUserData(user) {
  const snap = await get(ref(db, `users/${user.uid}`));
  currentUserData = snap.val() || {};

  const lastLogin = user.metadata.lastSignInTime;
  document.getElementById('userInfo').textContent = user.displayName || user.email.split('@')[0];

  if (user.photoURL) {
    document.getElementById('headerAvatar').src = user.photoURL;
    document.getElementById('headerAvatar').style.display = 'block';
  }

  // Update last login
  await update(ref(db, `users/${user.uid}`), {
    lastLogin: serverTimestamp(),
    email: user.email
  });
}

// Login
document.getElementById('loginBtn').onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
  } catch(e) { showMsg(e.message); }
};

// Signup
document.getElementById('signupBtn').onclick = async () => {
  if (!username.value.trim()) return showMsg('Weka jina lako');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);

    let photoURL = '';
    const file = avatarInput.files[0];
    if (file) {
      const storageRef = sRef(storage, `avatars/${cred.user.uid}`);
      const snap = await uploadBytes(storageRef, file);
      photoURL = await getDownloadURL(snap.ref);
    }

    await updateProfile(cred.user, { displayName: username.value, photoURL });
    await set(ref(db, `users/${cred.user.uid}`), {
      username: username.value,
      phone: phone.value,
      email: email.value,
      photoURL: photoURL,
      createdAt: serverTimestamp()
    });
  } catch(e) { showMsg(e.message); }
};

document.getElementById('logoutBtn').onclick = () => signOut(auth);

// Profile avatar preview
document.getElementById('avatarInput').onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => document.getElementById('previewAvatar').src = ev.target.result;
    reader.readAsDataURL(file);
  }
};

// Profile modal functions
window.openProfile = async () => {
  const user = auth.currentUser;
  const snap = await get(ref(db, `users/${user.uid}`));
  const data = snap.val() || {};

  document.getElementById('modalAvatar').src = user.photoURL || 'https://i.pravatar.cc/150';
  document.getElementById('modalName').textContent = user.displayName;

  document.getElementById('profileInfo').innerHTML = `
    <div class="info-row">
      <span class="info-label">Jina</span>
      <span class="info-value">${user.displayName || '-'}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Email</span>
      <span class="info-value">${user.email}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Namba ya simu</span>
      <span class="info-value">${data.phone || '-'}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Last Login</span>
      <span class="info-value">${user.metadata.lastSignInTime}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Alijiunga</span>
      <span class="info-value">${data.createdAt? new Date(data.createdAt).toLocaleDateString('sw') : '-'}</span>
    </div>
  `;

  document.getElementById('editUsername').value = user.displayName || '';
  document.getElementById('editPhone').value = data.phone || '';

  document.getElementById('profileModal').classList.add('show');
};

window.closeProfile = () => document.getElementById('profileModal').classList.remove('show');
window.switchTab = (tab) => {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  event.target.classList.add('active');
};

window.saveProfile = async () => {
  const user = auth.currentUser;
  const updates = {
    username: editUsername.value,
    phone: editPhone.value
  };

  const file = editAvatar.files[0];
  if (file) {
    const storageRef = sRef(storage, `avatars/${user.uid}`);
    const snap = await uploadBytes(storageRef, file);
    updates.photoURL = await getDownloadURL(snap.ref);
    await updateProfile(user, { photoURL: updates.photoURL });
  }

  await updateProfile(user, { displayName: editUsername.value });
  await update(ref(db, `users/${user.uid}`), updates);

  showMsg('Imehifadhiwa!', 'success');
  closeProfile();
  loadUserData(user);
};

// Friends system
window.openAddFriend = () => {
  openProfile();
  switchTab('friends');
};

async function loadAllUsers() {
  const snap = await get(ref(db, 'users'));
  const users = snap.val() || {};
  const container = document.getElementById('allUsers');
  container.innerHTML = '';

  Object.keys(users).forEach(uid => {
    if (uid === auth.currentUser.uid) return;
    const u = users[uid];
    const div = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `
      <img src="${u.photoURL || 'https://i.pravatar.cc/150'}" class="avatar">
      <div class="user-info">
        <div class="user-name">${u.username}</div>
        <div class="user-status">${u.phone || ''}</div>
      </div>
      <button class="btn btn-ghost" onclick="sendFriendRequest('${uid}')">Ongeza</button>
    `;
    container.appendChild(div);
  });
}

window.sendFriendRequest = async (uid) => {
  await set(ref(db, `friend_requests/${uid}/${auth.currentUser.uid}`), {
    from: auth.currentUser.uid,
    username: auth.currentUser.displayName,
    photoURL: auth.currentUser.photoURL,
    time: serverTimestamp()
  });
  showMsg('Ombi limetumwa!', 'success');
};

async function loadFriendRequests() {
  const snap = await get(ref(db, `friend_requests/${auth.currentUser.uid}`));
  const requests = snap.val() || {};
  const container = document.getElementById('friendRequests');
  container.innerHTML = '';

  Object.keys(requests).forEach(uid => {
    const r = requests[uid];
    const div = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `
      <img src="${r.photoURL || 'https://i.pravatar.cc/150'}" class="avatar">
      <div class="user-info">
        <div class="user-name">${r.username}</div>
      </div>
      <button class="btn" onclick="acceptFriend('${uid}')">Kubali</button>
    `;
    container.appendChild(div);
  });
}

window.acceptFriend = async (uid) => {
  await set(ref(db, `friends/${auth.currentUser.uid}/${uid}`), true);
  await set(ref(db, `friends/${uid}/${auth.currentUser.uid}`), true);
  await set(ref(db, `friend_requests/${auth.currentUser.uid}/${uid}`), null);
  loadFriends();
  loadFriendRequests();
};

async function loadFriends() {
  const snap = await get(ref(db, `friends/${auth.currentUser.uid}`));
  const friends = snap.val() || {};
  const container = document.getElementById('friendsList');
  container.innerHTML = '';

  if (Object.keys(friends).length === 0) {
    container.innerHTML = '<div style="color:var(--muted); font-size:14px;">Hakuna marafiki bado</div>';
    return;
  }

  Object.keys(friends).forEach(async uid => {
    const userSnap = await get(ref(db, `users/${uid}`));
    const u = userSnap.val();
    if (!u) return;

    const div = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `
      <img src="${u.photoURL || 'https://i.pravatar.cc/150'}" class="avatar">
      <div class="user-info">
        <div class="user-name">${u.username}</div>
        <div class="user-status">Online</div>
      </div>
    `;
    container.appendChild(div);
  });
}

// Chat functions
async function sendMessage() {
  const msg = msgInput.value.trim();
  if (!msg ||!auth.currentUser) return;

  const lastMsg = localStorage.getItem('lastMsgTime');
  if (Date.now() - lastMsg < 2000) return showMsg('Subiri kidogo');
  localStorage.setItem('lastMsgTime', Date.now());

  await push(ref(db, 'global_chat'), {
    uid: auth.currentUser.uid,
    username: auth.currentUser.displayName,
    photoURL: auth.currentUser.photoURL,
    text: msg,
    time: serverTimestamp()
  });

  msgInput.value = '';
  msgInput.style.height = 'auto';
  set(ref(db, `typing/${auth.currentUser.uid}`), false);
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeypress = (e) => {
  if (e.key === 'Enter' &&!e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

msgInput.oninput = () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = msgInput.scrollHeight + 'px';
  handleTyping();
};

document.getElementById('imageInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file ||!auth.currentUser) return;
  if (file.size > 5 * 1024 * 1024) return showMsg('Picha iwe chini ya 5MB');

  const storageRef = sRef(storage, `chat_images/${Date.now()}_${file.name}`);
  const snap = await uploadBytes(storageRef, file);
  const url = await getDownloadURL(snap.ref);

  await push(ref(db, 'global_chat'), {
    uid: auth.currentUser.uid,
    username: auth.currentUser.displayName,
    photoURL: auth.currentUser.photoURL,
    imageUrl: url,
    time: serverTimestamp()
  });
};

function loadMessages() {
  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';
  const q = query(ref(db, 'global_chat'), limitToLast(100));

  onChildAdded(q, (data) => {
    const msg = data.val();
    if (!msg) return;

    const isMe = msg.uid === auth.currentUser.uid;
    const time = msg.time? new Date(msg.time).toLocaleTimeString('sw', {hour: '2-digit', minute: '2-digit'}) : '';

    const wrap = document.createElement('div');
    wrap.className = `message-wrap ${isMe? 'me' : ''}`;

    let content = escapeHtml(msg.text || '');
    if (msg.imageUrl) content += `<img src="${msg.imageUrl}" alt="image">`;

    wrap.innerHTML = `
      <div class="message ${isMe? 'me' : 'other'}">${content}</div>
      <div class="msg-meta">${isMe? '' : msg.username + ' • '}${time}</div>
    `;
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

let typingTimeout;
function handleTyping() {
  if (!auth.currentUser) return;
  set(ref(db, `typing/${auth.currentUser.uid}`), true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    set(ref(db, `typing/${auth.currentUser.uid}`), false);
  }, 2000);
}

function setupTyping() {
  onValue(ref(db, 'typing'), (snap) => {
    const data = snap.val() || {};
    const othersTyping = Object.keys(data).some(uid => uid!== auth.currentUser?.uid && data[uid]);
    document.getElementById('typing').style.display = othersTyping? 'block' : 'none';
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showMsg(msg, type='error') {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.style.color = type === 'success'? 'var(--success)' : 'var(--danger)';
  setTimeout(() => el.textContent = '', 4000);
}

document.onclick = (e) => {
  if (!e.target.closest('#emojiPicker') &&!e.target.closest('#emojiBtn')) {
    emojiPicker.classList.remove('show');
  }
  if (e.target.id === 'profileModal') closeProfile();
};
</script>
</body>
</html>
